[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprneuro"
version = "0.1.0"
description = "Standalone observational sidecar: recall, logging, and alerting for Hyprland desktops"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hyprneuro = "hyprneuro.sidecar:main"
hyprneuro-chrome-host = "hyprneuro.chrome_host:main"
hyprneuro-assistant = "hyprneuro.assistant_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
